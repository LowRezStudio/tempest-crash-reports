name = "tempest-crash-reports"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CRASH_THREADS"
class_name = "CrashThread"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrashThread"]

[assets]
directory = "./public"

# Per IP.
[[ratelimits]]
name = "REPORTS"
namespace_id = "1001"
simple = { limit = 2, period = 60 }
